<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=http://127.0.0.1:8000/">
    <title>Emisha Tours & Travels</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: radial-gradient(circle at 50% 30%, #0d284f 0%, #061122 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            max-width: 450px;
        }
        h1 {
            color: #D4AF37;
            margin-top: 0;
            font-size: 24px;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
        }
        a.btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 28px;
            background: #D4AF37;
            color: #0b1f3a;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: opacity 0.2s;
        }
        a.btn:hover {
            opacity: 0.9;
        }
    </style>
    <script>
        window.location.href = "http://127.0.0.1:8000/";
    </script>
</head>
<body>
    <div class="card">
        <h1>Emisha Tours & Travels</h1>
        <p>Connecting to the live local server...</p>
        <p>If you are not redirected automatically, click below:</p>
        <a class="btn" href="http://127.0.0.1:8000/">Open Web Application</a>
    </div>
</body>
</html>
